# Story Development Test Set（Story 10 C 节：≥10 个 Story Seed）
#
# 用途：检验"同一个 Seed → 2~3 个提案"的**保真度**与**差异度**
# （需求规格 §31.1；《架构设计》§34 P2 的"Seed 保真度"检查）。
#
# 边界（v0.1）：
# - 本文件只是**测试集输入**，不进入任何项目目录（projects/ 不变）；
# - `status: measured` 的 Seed 已跑完 Gate 2，指标由
#   `pnpm harness eval story-development` 从项目状态汇总；
# - `status: corpus_only` 的 Seed 只有输入，尚无离线 fixture 覆盖
#   （离线 fixture 需要真实模型产出后才能录制），因此不产出指标行。
#   这是 v0.1 的已知缺口，已记入 docs/OPEN-QUESTIONS.md（OQ-60）。
#
# 约束：
# - 每个 Seed 的 `text` 必须满足 Story Seed Schema（1..500 字符，非空白）；
# - `expectation.distinctness_required` 恒为 true（差异度是硬门槛）；
# - `expectation.proposal_count_min` 至少 2（Story 2 起的最低要求）。

schema_version: '0.1'
set_id: story-development-test-set
seed_count_minimum: 10
seeds:
  - seed_id: SD_001
    status: measured
    project_id: demo-01
    title: 一次性筷子
    text: 一对情侣因为一件小事争吵，女方提出分手。
    pov_hint: single
    expectation:
      proposal_count_min: 3
      distinctness_required: true
  - seed_id: SD_002
    status: measured
    project_id: demo-02
    title: 两层之间的电梯
    text: 两个人在电梯里被困了十分钟，谁也按不下那个按钮。
    pov_hint: dual
    expectation:
      proposal_count_min: 3
      distinctness_required: true
  - seed_id: SD_003
    status: corpus_only
    title: 借来的伞
    text: 一个女孩把同事的伞借走，后来又还了一把一样的。
    pov_hint: single
    expectation:
      proposal_count_min: 2
      distinctness_required: true
  - seed_id: SD_004
    status: corpus_only
    title: 迟到的电话
    text: 一个男人删掉了一个没接的电话记录。
    pov_hint: single
    expectation:
      proposal_count_min: 2
      distinctness_required: true
  - seed_id: SD_005
    status: corpus_only
    title: 空座位
    text: 教室里有个座位一直空着，老师从来不点名。
    pov_hint: dual
    expectation:
      proposal_count_min: 2
      distinctness_required: true
  - seed_id: SD_006
    status: corpus_only
    title: 搬家
    text: 一个老人决定搬去和儿子住，但行李一直没收拾。
    pov_hint: single
    expectation:
      proposal_count_min: 2
      distinctness_required: true
  - seed_id: SD_007
    status: corpus_only
    title: 加错的好友
    text: 两个人加错了微信，聊了半年才发现。
    pov_hint: dual
