# 反 AI 模板动作词表（仓库级默认）
#
# 依据：需求规格 §25.1 / 架构设计 §26 —— "Story 8 开发前必须冻结一份版本化模板动作词表"。
# 位置裁决（OQ-07）：**项目级优先**，路径为
#   projects/<project_id>/config/anti-ai-template-actions.yaml
# 允许 fallback 到本文件（仓库级默认词表）。
#
# 匹配口径（Story 8 起始会裁决）：
# - **字面匹配，不解释为正则**（pattern 就是原文子串）；
# - **变体用多条独立 action，不合并**（例如"苦笑"与"露出一丝苦笑"是两条）；
# - `severity` 是"命中 1 次"时的级别；同一 action 在同一 Scene 命中 ≥3 次时升级为 high；
# - **词表变化必须修改 `version`**，运行时会把它写进 reports/linter.yaml。
#
# schema_version: "0.1"
# version: "2026.01"
# actions:
#   - id: TA_001
#     pattern: 沉默了片刻
#     severity: medium
#     note: 需求规格 §25.1 点名的首版测试项

